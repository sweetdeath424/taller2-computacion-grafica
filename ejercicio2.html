<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 - Reserva</title>
  <link rel="stylesheet" href="ejercicio2.css">
</head>
<body>
  <div class="card">
    <h2>Reservar Mesa o Espacio</h2>
    <form action="#" method="post">
      <div class="grid">
        <div class="field">
          <label for="res-fecha">Fecha</label>
          <input type="date" id="res-fecha" name="fecha" required>
        </div>
        <div class="field">
          <label for="res-hora">Hora</label>
          <input type="time" id="res-hora" name="hora" required>
        </div>
      </div>
      <div class="field">
        <label for="res-personas">Número de personas</label>
        <input type="number" id="res-personas" name="personas" min="1" max="50" value="2" required>
      </div>
      <div class="field">
        <label for="res-comentarios">Comentarios adicionales</label>
        <textarea id="res-comentarios" name="comentarios" rows="4" placeholder="Preferencias o requerimientos especiales..."></textarea>
      </div>
      <button type="submit" class="btn">Confirmar Reserva</button>
    </form>
  </div>
</body>
</html>
