<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 - Registro</title>
  <link rel="stylesheet" href="ejercicio1.css">
</head>
<body>
  <div class="card">
    <h2>Registro de Usuario</h2>
    <form action="#" method="post">
      <div class="field">
        <label for="reg-nombre">Nombre completo</label>
        <input type="text" id="reg-nombre" name="nombre" placeholder="Juan Pérez" required>
      </div>
      <div class="field">
        <label for="reg-email">Correo electrónico</label>
        <input type="email" id="reg-email" name="email" placeholder="juan@correo.com" required>
      </div>
      <div class="field">
        <label for="reg-pass">Contraseña</label>
        <input type="password" id="reg-pass" name="password" minlength="8" placeholder="Mínimo 8 caracteres" required>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" name="terminos" required>
        <span>Acepto los términos y condiciones de uso</span>
      </label>
      <button type="submit" class="btn">Crear cuenta</button>
    </form>
  </div>
</body>
</html>
